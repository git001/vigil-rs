[package]
name    = "vigil-types"
version = "4.0.0"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-only"

[features]
# Reading log lines and joining multi-line entries from byte streams
# (lines module), on the tokio runtime.
lines = ["dep:tokio", "dep:regex"]

[dependencies]
tokio      = { workspace = true, optional = true }
regex      = { workspace = true, optional = true }
serde      = { workspace = true }
serde_yaml = { workspace = true }
serde_json = { workspace = true }
indexmap   = { workspace = true }
utoipa     = { workspace = true }
chrono     = { workspace = true }
uuid       = { workspace = true }
thiserror  = { workspace = true }
nix        = { workspace = true }

[dev-dependencies]
tokio      = { workspace = true }

[lints]
workspace = true
