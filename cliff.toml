# git-cliff configuration — https://git-cliff.org
#
# Produces CHANGELOG.md in the Keep a Changelog 1.1.0 format
# (https://keepachangelog.com/en/1.1.0/). Only user-facing changes are
# listed; docs, tests, CI, style and release-housekeeping commits are skipped.
#
# Regenerate before tagging a release (part of the version-bump commit):
#   git cliff --tag vX.Y.Z -o CHANGELOG.md
#
# Section order follows Keep a Changelog, preceded by an extra
# "⚠ Breaking Changes" section that also shows the migration note from the
# commit's "BREAKING CHANGE:" footer. git-cliff sorts groups by name, so each
# group carries an HTML-comment prefix that is stripped in the output.

[changelog]
header = """
# Changelog

All notable changes to vigil-rs are documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

Upgrading from v3: see the [migration guide](docs/user-guide/migration-v3-to-v4.md).
"""

body = """
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [Unreleased]
{% endif -%}
{% set_global visible = 0 -%}
{% for commit in commits -%}
{% if commit.group is not containing("Hidden") %}{% set_global visible = visible + 1 %}{% endif -%}
{% endfor -%}
{% if visible == 0 %}
No user-facing changes.
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") -%}
{% if group is not containing("Hidden") %}
### {{ group | striptags | trim }}

{% for commit in commits -%}
- {% if commit.scope %}**{{ commit.scope }}**: {% endif -%}
{{ commit.message | split(pat="\n") | first | trim | upper_first }} \
([`{{ commit.id | truncate(length=7, end="") }}`](https://github.com/git001/vigil-rs/commit/{{ commit.id }}))
{% if group is containing("Breaking") and commit.breaking_description \
   and commit.breaking_description != commit.message -%}
{{ "  - " }}*Migration:* {{ commit.breaking_description | split(pat="\n") | join(sep=" ") | trim }}
{% endif -%}
{% endfor -%}
{% endif -%}
{% endfor %}
"""

footer = """
{% for release in releases -%}
{% if release.version -%}
{% if release.previous.version -%}
[{{ release.version | trim_start_matches(pat="v") }}]: https://github.com/git001/vigil-rs/compare/{{ release.previous.version }}...{{ release.version }}
{% else -%}
[{{ release.version | trim_start_matches(pat="v") }}]: https://github.com/git001/vigil-rs/releases/tag/{{ release.version }}
{% endif -%}
{% else -%}
[Unreleased]: https://github.com/git001/vigil-rs/compare/{{ release.previous.version }}...HEAD
{% endif -%}
{% endfor -%}
"""

trim = false

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false

commit_preprocessors = [
    { pattern = '\(#([0-9]+)\)', replace = "([#${1}](https://github.com/git001/vigil-rs/pull/${1}))" },
    # Five v4 commits put the "!" before the scope ("fix!(vigild):"), which
    # is no conventional commit: their type and BREAKING CHANGE footer would
    # be lost.
    { pattern = '^(\w+)!\(([^)]*)\):', replace = "${1}(${2})!:" },
    # 87335a3: a footer line starting with "`pass-env-glob: " would be read
    # as a footer of its own and cut the migration note.
    { pattern = 'e\.g\.\n`pass-env-glob', replace = "e.g. `pass-env-glob" },
    { pattern = 'An\nenv:VAR that is unset', replace = "An env:VAR that is unset" },
]

# First match wins.
commit_parsers = [
    # Never shown (kept in a hidden group so that releases without
    # user-facing changes still get a heading and a compare link).
    { message = "^Merge ", group = "<!-- 9 -->Hidden" },
    { message = "(?i)^(update to |updte |)version ", group = "<!-- 9 -->Hidden" },

    # Breaking changes get their own section at the top of each release,
    # whatever their type ("type!:" or a "BREAKING CHANGE:" footer).
    { message = "^\\w+(\\(.*\\))?!:", group = "<!-- 0 -->⚠ Breaking Changes" },
    { footer = "^BREAKING[ -]CHANGE", group = "<!-- 0 -->⚠ Breaking Changes" },

    # Mentions security in its body, but only fixes the examples.
    { sha = "6d08627f2f5e68ce82428500ed69cb282156f80e", group = "<!-- 5 -->Fixed" },  # 4.0: make every example run with v4

    # Security first, so a security fix lands under "Security", not "Fixed".
    # Only code/dependency commits count: docs that merely mention
    # "security" must not end up here.
    { message = "^(fix|feat|chore)(\\(.*\\))?!?: .*(?i:security|RUSTSEC-|CVE-)", group = "<!-- 6 -->Security" },
    { message = "^(fix|feat|chore)", body = "(?i)security|RUSTSEC-|CVE-", group = "<!-- 6 -->Security" },

    # Security fixes whose message does not say so.
    { sha = "2483705f6dbfe1f603b667dd23b2367831385403", group = "<!-- 6 -->Security" },  # 3.2.2: privilege drop kept root groups
    { sha = "f6f905a515e77d282866bf1074bdb1b5edb512ec", group = "<!-- 6 -->Security" },  # 3.2.2: control socket hardening

    # Conventional commits.
    { message = "^feat", group = "<!-- 1 -->Added" },
    { message = "^(perf|refactor)", group = "<!-- 2 -->Changed" },
    { message = "(?i)^\\w+(\\(.*\\))?!?: deprecate", group = "<!-- 3 -->Deprecated" },
    { message = "(?i)^\\w+(\\(.*\\))?!?: remove", group = "<!-- 4 -->Removed" },
    { message = "^fix", group = "<!-- 5 -->Fixed" },
    { message = "^chore\\(deps", group = "<!-- 2 -->Changed" },

    # User-facing changes from before the switch to conventional commits.
    { sha = "04342f81f5ca260426263f6d5358012cb6dab2fb", group = "<!-- 1 -->Added" },    # json log format for vigil-log-relay
    { sha = "384052eabdee2243666c346290c6b72d35b5e68d", group = "<!-- 1 -->Added" },    # --version for vigil-log-relay
    { sha = "9ef0c935936f5d914ef9210901b1475cff7703bb", group = "<!-- 2 -->Changed" },  # image ships vigil-log-relay, bash, curl
    { sha = "139f6b0ce9a82affca3009105af5b56e64ed71da", group = "<!-- 2 -->Changed" },  # image runs as USER 1001

    # Everything else (docs, test, ci, style, chore, free-form housekeeping).
    { message = ".*", group = "<!-- 9 -->Hidden" },
]

protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9].*"
skip_tags = "v.*-rc[0-9]+"
ignore_tags = ""
topo_order = false
sort_commits = "oldest"
