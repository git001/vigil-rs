openapi: 3.1.0
info:
  title: vigil API
  version: v4
  description: |
    HTTP API for the vigild service supervisor daemon.

    All endpoints are served over a Unix socket (default `/run/vigild.sock`).
    Responses are wrapped in a JSON envelope with a `result` field on success
    or a `message` field on error.

    **curl example (Unix socket):**
    ```
    curl --unix-socket /run/vigild.sock http://localhost/v1/system-info
    ```

paths:

  # ---------------------------------------------------------------------------
  # System info
  # ---------------------------------------------------------------------------

  /v1/system-info:
    get:
      summary: Get system info
      tags:
        - system info
      description: Returns the daemon version, boot ID, and start time.
      responses:
        "200":
          description: Daemon system information.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemInfoResponse"
              example:
                result:
                  version: "1.0.0"
                  boot-id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                  start-time: "2026-03-18T10:00:00Z"
        "500":
          $ref: "#/components/responses/Error"

  # ---------------------------------------------------------------------------
  # Services
  # ---------------------------------------------------------------------------

  /v1/services:
    get:
      summary: List services
      tags:
        - services
      description: Returns the current status of all or selected services.
      parameters:
        - name: names
          in: query
          description: Comma-separated list of service names to filter by. Omit for all services.
          required: false
          schema:
            type: string
          example: "web,worker"
      responses:
        "200":
          description: List of service status entries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServicesResponse"
              example:
                result:
                  - name: web
                    startup: enabled
                    current: active
                    current-since: "2026-03-18T10:00:01Z"
                  - name: worker
                    startup: disabled
                    current: inactive
                    current-since: "2026-03-18T10:00:00Z"
        "500":
          $ref: "#/components/responses/Error"

    post:
      summary: Perform a service action
      tags:
        - services
      description: |
        Start, stop, or restart one or more services.

        **Actions:**
        - `start` — start the named services (or all if empty)
        - `stop` — stop the named services
        - `restart` — restart the named services
        - `autostart` — start the services vigild starts at startup (`startup: enabled`, not scheduled), or only the named ones among them; the plan is not changed
        - `replan` — reload layers and apply changes (equivalent to `POST /v1/replan`)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServicesAction"
            examples:
              start:
                summary: Start specific services
                value:
                  action: start
                  services: ["web", "worker"]
              stop_all:
                summary: Stop all services
                value:
                  action: stop
                  services: []
      responses:
        "200":
          description: Change record for the performed action.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeResponse"
              example:
                result:
                  id: "1"
                  kind: "start"
                  summary: "Start [\"web\", \"worker\"]"
                  status: done
                  spawn-time: "2026-03-18T10:01:00Z"
                  ready-time: "2026-03-18T10:01:01Z"
        "500":
          $ref: "#/components/responses/Error"

  # ---------------------------------------------------------------------------
  # Changes
  # ---------------------------------------------------------------------------

  /v1/changes/{id}:
    get:
      summary: Get a change by ID
      tags:
        - changes
      description: Returns the change record for the given change ID.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: "1"
      responses:
        "200":
          description: The requested change record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeResponse"
              example:
                result:
                  id: "1"
                  kind: "restart"
                  summary: "Restart [\"web\"]"
                  status: done
                  spawn-time: "2026-03-18T10:02:00Z"
                  ready-time: "2026-03-18T10:02:02Z"
        "404":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"

  # ---------------------------------------------------------------------------
  # Checks
  # ---------------------------------------------------------------------------

  /v1/checks:
    get:
      summary: List health checks
      tags:
        - checks
      description: Returns the current status of all or selected health checks.
      parameters:
        - name: names
          in: query
          description: Comma-separated list of check names to filter by. Omit for all checks.
          required: false
          schema:
            type: string
          example: "http-alive,db-ready"
      responses:
        "200":
          description: List of check status entries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChecksResponse"
              example:
                result:
                  - name: http-alive
                    level: alive
                    status: up
                    failures: 0
                    threshold: 3
                  - name: db-ready
                    level: ready
                    status: down
                    failures: 3
                    threshold: 3
                    last-error: "HTTP 503 Service Unavailable"
        "500":
          $ref: "#/components/responses/Error"

  /v1/signals:
    post:
      summary: Send a signal to services
      tags:
        - services
      description: >
        Sends `signal` to the process group of each service in `services`,
        e.g. SIGHUP to make nginx re-read its configuration. Every service
        must exist and have a running process (starting, active or
        stopping); otherwise none gets the signal. Signal names as in
        `stop-signal`. Required access: `write`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignalsRequest"
            example:
              signal: SIGHUP
              services: [nginx]
      responses:
        "200":
          description: The services that got the signal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignalsResponse"
              example:
                result:
                  signal: SIGHUP
                  services: [nginx]
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /v1/health:
    get:
      summary: Health of the checks
      tags:
        - checks
      description: >
        vigild's health endpoint, for Kubernetes httpGet probes: 200 when
        none of the selected checks is down, otherwise 502. Only running
        checks count; a check with `startup: disabled` is ignored.
        `level=ready` includes `alive` checks. A name that is not a check is
        404, an unknown query parameter or level 400. Required access: `open`.
      parameters:
        - name: level
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/CheckLevel"
        - name: names
          in: query
          description: Comma-separated check names. Omit for all checks.
          required: false
          schema:
            type: string
          example: "web-alive,db-ready"
      responses:
        "200":
          description: No selected check is down.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                result:
                  healthy: true
        "400":
          description: Unknown query parameter or level.
        "404":
          $ref: "#/components/responses/Error"
        "502":
          description: At least one selected check is down.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                result:
                  healthy: false

  /v1/checks/refresh:
    post:
      summary: Run a check now
      tags:
        - checks
      description: >
        Runs the check at once and returns its state after the run, plus
        `error`: why this run failed (absent when it passed). The run counts
        like a scheduled one (failures, threshold, status, alerts). A check
        with `startup: disabled` runs once without changing any state.
        Required access: `write`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckRefreshRequest"
            example:
              name: db-ready
      responses:
        "200":
          description: The check after the run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckRefreshResponse"
              example:
                result:
                  info:
                    name: db-ready
                    level: ready
                    status: down
                    failures: 3
                    threshold: 3
                    next-run-in-secs: 7
                    last-error: "connect localhost:5432: Connection refused (os error 111)"
                  error: "connect localhost:5432: Connection refused (os error 111)"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"

  # ---------------------------------------------------------------------------
  # Logs
  # ---------------------------------------------------------------------------

  /v1/logs:
    get:
      summary: Get recent log output
      tags:
        - logs
      description: |
        Returns the most recent log lines from service stdout/stderr.

        With `follow=true` the response is a stream instead: the last `n`
        lines, then each new line, as newline-delimited JSON
        (`application/x-ndjson`), until the client closes the connection.
        An unknown query parameter is `400`.
      parameters:
        - name: services
          in: query
          description: Comma-separated list of service names to filter by. Omit for all services.
          required: false
          schema:
            type: string
          example: "web,worker"
        - name: n
          in: query
          description: Number of most-recent lines to return. Default is 100.
          required: false
          schema:
            type: integer
            default: 100
          example: 50
        - name: follow
          in: query
          description: |
            `true` keeps the connection open and streams the last `n` lines,
            then each new line, as newline-delimited JSON, like
            `/v1/logs/follow?format=ndjson`.
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Recent log entries; with `follow=true` an NDJSON stream.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogsResponse"
              example:
                result:
                  - timestamp: "2026-03-18T10:01:00.123Z"
                    service: web
                    stream: stdout
                    message: "Server listening on :8080"
                  - timestamp: "2026-03-18T10:01:01.456Z"
                    service: web
                    stream: stderr
                    message: "WARN: slow response 823ms"
            application/x-ndjson:
              schema:
                type: string
              example: |
                {"timestamp":"2026-03-18T10:01:00.123Z","service":"web","stream":"stdout","message":"Server listening on :8080"}
                {"timestamp":"2026-03-18T10:01:01.456Z","service":"web","stream":"stderr","message":"WARN: slow response 823ms"}
        "400":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"

  /v1/logs/follow:
    get:
      summary: Stream live log output (SSE)
      tags:
        - logs
      description: |
        Opens a Server-Sent Events stream that delivers log entries in real time
        as services write to stdout/stderr.

        Each SSE event has the format:
        ```
        data: {"timestamp":"...","service":"...","stream":"stdout","message":"..."}
        ```

        A keep-alive comment (`": ping"`) is sent every 15 seconds.
        If the consumer is too slow, a lagged comment is sent:
        ```
        : lagged: skipped N entries
        ```
      parameters:
        - name: services
          in: query
          description: Comma-separated list of service names to filter by. Omit for all services.
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Server-Sent Events stream of log entries.
          content:
            text/event-stream:
              schema:
                type: string
              example: |
                data: {"timestamp":"2026-03-18T10:01:00.123Z","service":"web","stream":"stdout","message":"ready"}

                : ping

  # ---------------------------------------------------------------------------
  # Replan
  # ---------------------------------------------------------------------------

  /v1/replan:
    post:
      summary: Reload layers and replan
      tags:
        - replan
      description: |
        Reads all layer YAML files from the layers directory, re-merges them
        into a new plan, starts any newly enabled services, and stops any
        removed ones. Equivalent to `vigil replan`.
      responses:
        "200":
          description: Replan completed successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptyResponse"
              example:
                result: null
        "500":
          $ref: "#/components/responses/Error"

  # ---------------------------------------------------------------------------
  # Identities
  # ---------------------------------------------------------------------------

  /v1/identities:
    get:
      summary: List identities
      tags:
        - identities
      description: >-
        Returns all or selected identities: those from layer files
        (`source: layer`, read-only over the API) and those added over the
        API (`source: api`).
      parameters:
        - name: names
          in: query
          description: Comma-separated list of identity names to filter by. Omit for all.
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of identities.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentitiesResponse"
              example:
                result:
                  - name: log-relay
                    access: read
                    basic:
                      password-hash: "$6$testextra$Cq1GhPxDNtKxM7J.P1EovJ64dyEsjMy59Cr2zHgWhpmUsETC.YtW8GFsrGO810Kh5f/9.SYG53plbhT3VaA7z/"
                    source: layer
                    layer: 001-auth
                  - name: ops
                    access: write
                    local: {}
                    source: api
        "500":
          $ref: "#/components/responses/Error"

    post:
      summary: Add or update identities
      tags:
        - identities
      description: >-
        Creates or updates the named identities. A name of an identity from
        a layer file is rejected with 409 (change it in the layer file).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddIdentitiesRequest"
            example:
              identities:
                ops:
                  access: write
                  local: {}
      responses:
        "200":
          description: Identities added or updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptyResponse"
              example:
                result: null
        "409":
          description: A name belongs to an identity from a layer file.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                message: 'identity "log-relay" is defined in layer "001-auth"; change it there'
        "500":
          $ref: "#/components/responses/Error"

    delete:
      summary: Remove identities
      tags:
        - identities
      description: >-
        Removes the named identities. If one of them comes from a layer
        file, nothing is removed (409).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemoveIdentitiesRequest"
            example:
              identities: ["ops"]
      responses:
        "200":
          description: Names of the removed identities.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemovedIdentitiesResponse"
              example:
                result: ["ops"]
        "409":
          description: A name belongs to an identity from a layer file; nothing was removed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                message: 'identity "log-relay" is defined in layer "001-auth"; change it there'
        "500":
          $ref: "#/components/responses/Error"

# =============================================================================
# Components
# =============================================================================

components:

  # ---------------------------------------------------------------------------
  # Responses (shared error)
  # ---------------------------------------------------------------------------

  responses:
    Error:
      description: An error occurred.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            message: "service 'web' not found"

  # ---------------------------------------------------------------------------
  # Schemas
  # ---------------------------------------------------------------------------

  schemas:

    # ---- Envelope ----

    ErrorEnvelope:
      type: object
      properties:
        result:
          type: "null"
        message:
          type: string
          description: Human-readable error message.
      required: [message]

    # ---- System info ----

    SystemInfo:
      type: object
      properties:
        version:
          type: string
          description: vigild version string.
          example: "1.0.0"
        boot-id:
          type: string
          format: uuid
          description: UUID generated fresh at each daemon start. Matches the pebble boot-id field.
          example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
        start-time:
          type: string
          format: date-time
          description: Daemon start time (ISO 8601 / RFC 3339). vigil extension.
          example: "2026-03-18T10:00:00Z"
      required: [version, boot-id, start-time]

    SystemInfoResponse:
      type: object
      properties:
        result:
          $ref: "#/components/schemas/SystemInfo"
      required: [result]

    # ---- Services ----

    ServiceStatus:
      type: string
      enum: [starting, active, inactive, backoff, error, done]
      description: |
        - `starting` — process is running but not ready yet (`ready: notify`
          or `ready: check`); dependent services wait. New in v4.
        - `active` — process is running and ready
        - `inactive` — process is not running
        - `backoff` — waiting before the next restart attempt
        - `error` — failed to start or exceeded backoff limit
        - `done` — a `type: oneshot` service finished successfully. New in v4.

    ServiceInfo:
      type: object
      properties:
        name:
          type: string
          example: web
        startup:
          type: string
          enum: [enabled, disabled]
          description: Whether the service starts automatically on daemon start / replan.
        current:
          $ref: "#/components/schemas/ServiceStatus"
        current-since:
          type: string
          format: date-time
          description: When the service entered its current state.
          example: "2026-03-18T10:00:01Z"
        stop-signal:
          type: string
          description: Effective stop signal.
          example: SIGTERM
        on-success:
          type: string
          description: Effective on-success policy.
          example: restart
        on-failure:
          type: string
          description: Effective on-failure policy.
          example: restart
        last-exit:
          $ref: "#/components/schemas/ExitInfo"
        status-message:
          type: string
          description: |
            Last `STATUS=` text the service sent via sd_notify
            (`ready: notify`). Cleared on every start. New in v4.
          example: "loading cache 3/5"
        next-run:
          type: string
          format: date-time
          description: |
            Next scheduled run of a `type: oneshot` service with `schedule`
            (and `startup: enabled`). New in v4.
          example: "2026-11-04T03:00:00Z"
      required: [name, startup, current, stop-signal, on-success, on-failure]

    ExitInfo:
      type: object
      description: |
        How the last process of the service ended, before `exit-code-map`.
        Absent until the service has exited once. New in v4.
      properties:
        code:
          type: integer
          description: Exit code, if the process exited normally.
          example: 3
        signal:
          type: integer
          description: Signal number, if the process was killed by a signal.
          example: 15

    ServicesResponse:
      type: object
      properties:
        result:
          type: array
          items:
            $ref: "#/components/schemas/ServiceInfo"
      required: [result]

    ServiceAction:
      type: string
      enum: [start, stop, restart, autostart, replan]

    ServicesAction:
      type: object
      properties:
        action:
          $ref: "#/components/schemas/ServiceAction"
        services:
          type: array
          items:
            type: string
          description: Service names to act on. Empty list means all services.
      required: [action, services]

    # ---- Changes ----

    ChangeStatus:
      type: string
      enum: [doing, done, error, hold]

    ChangeInfo:
      type: object
      properties:
        id:
          type: string
          description: Monotonically increasing change ID.
          example: "1"
        kind:
          type: string
          description: Action that produced this change.
          example: "start"
        summary:
          type: string
          description: Human-readable description.
          example: "Start [\"web\", \"worker\"]"
        status:
          $ref: "#/components/schemas/ChangeStatus"
        spawn-time:
          type: string
          format: date-time
        ready-time:
          type: string
          format: date-time
        err:
          type: string
          description: Error message if status is `error`.
      required: [id, kind, summary, status, spawn-time]

    ChangeResponse:
      type: object
      properties:
        result:
          $ref: "#/components/schemas/ChangeInfo"
      required: [result]

    # ---- Checks ----

    CheckLevel:
      type: string
      enum: [alive, ready]
      description: |
        - `alive` — basic liveness check
        - `ready` — readiness check (implies alive)

    CheckStatus:
      type: string
      enum: [up, down]

    CheckInfo:
      type: object
      properties:
        name:
          type: string
          example: http-alive
        level:
          $ref: "#/components/schemas/CheckLevel"
        status:
          $ref: "#/components/schemas/CheckStatus"
        failures:
          type: integer
          description: Number of consecutive failures since last success.
          example: 0
        threshold:
          type: integer
          description: Number of failures required to declare the check down.
          example: 3
        next-run-in-secs:
          type: integer
          description: Seconds until the next run; absent during the initial delay.
          example: 7
        last-error:
          type: string
          description: >
            Why the last run failed, e.g. `HTTP 503 Service Unavailable` or
            `exit status 1: <output>` (exec checks add the last 4 KiB of their
            output). Absent once a run passes.
          example: "HTTP 503 Service Unavailable"
      required: [name, level, status, failures, threshold]

    SignalsRequest:
      type: object
      properties:
        signal:
          type: string
          description: Signal name as in stop-signal, e.g. SIGHUP.
        services:
          type: array
          items:
            type: string
          minItems: 1
      required: [signal, services]
      additionalProperties: false

    SignalsResponse:
      type: object
      properties:
        result:
          type: object
          properties:
            signal:
              type: string
            services:
              type: array
              items:
                type: string
          required: [signal, services]
      required: [result]

    HealthResponse:
      type: object
      properties:
        result:
          type: object
          properties:
            healthy:
              type: boolean
              description: No selected, running check is down.
          required: [healthy]
      required: [result]

    CheckRefreshRequest:
      type: object
      properties:
        name:
          type: string
          description: The check to run now.
      required: [name]
      additionalProperties: false

    CheckRefreshResponse:
      type: object
      properties:
        result:
          type: object
          properties:
            info:
              $ref: "#/components/schemas/CheckInfo"
            error:
              type: string
              description: Why this run failed; absent when it passed.
          required: [info]
      required: [result]

    ChecksResponse:
      type: object
      properties:
        result:
          type: array
          items:
            $ref: "#/components/schemas/CheckInfo"
      required: [result]

    # ---- Logs ----

    LogStream:
      type: string
      enum: [stdout, stderr]

    LogEntry:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
          example: "2026-03-18T10:01:00.123Z"
        service:
          type: string
          example: web
        stream:
          $ref: "#/components/schemas/LogStream"
        message:
          type: string
          example: "Server listening on :8080"
      required: [timestamp, service, stream, message]

    LogsResponse:
      type: object
      properties:
        result:
          type: array
          items:
            $ref: "#/components/schemas/LogEntry"
      required: [result]

    # ---- Replan ----

    EmptyResponse:
      type: object
      properties:
        result:
          type: "null"

    # ---- Identities ----

    IdentityAccess:
      type: string
      enum: [read, write, admin]
      description: |
        - `read` — can query service/check/log state
        - `write` — can start/stop/restart services and replan
        - `admin` — full access including identity management

    LocalIdentity:
      type: object
      description: Matches Unix-socket connections by the caller's UID.
      properties:
        user-id:
          type: integer
          description: Restrict to this UID. Omit to allow any local user.
          example: 1000

    BasicIdentity:
      type: object
      description: Matches HTTP Basic auth (user name = identity name).
      properties:
        password-hash:
          type: string
          description: SHA-512 crypt hash, e.g. from `openssl passwd -6`.
      required: [password-hash]

    TlsIdentity:
      type: object
      description: Matches TLS connections whose client cert was signed by the given CA.
      properties:
        ca-cert:
          type: string
          description: PEM-encoded CA certificate.
      required: [ca-cert]

    Identity:
      type: object
      properties:
        name:
          type: string
          example: ops
        access:
          $ref: "#/components/schemas/IdentityAccess"
        local:
          $ref: "#/components/schemas/LocalIdentity"
        basic:
          $ref: "#/components/schemas/BasicIdentity"
        tls:
          $ref: "#/components/schemas/TlsIdentity"
        source:
          type: string
          enum: [api, layer]
          description: Added over the API, or defined in a layer file (read-only over the API).
        layer:
          type: string
          description: The layer file (without extension) of a `layer` identity.
          example: 001-auth
      required: [name, access, source]

    IdentitiesResponse:
      type: object
      properties:
        result:
          type: array
          items:
            $ref: "#/components/schemas/Identity"
      required: [result]

    IdentitySpec:
      type: object
      description: Identity definition used when adding/updating (name is the map key, not a field).
      properties:
        access:
          $ref: "#/components/schemas/IdentityAccess"
        local:
          $ref: "#/components/schemas/LocalIdentity"
        basic:
          $ref: "#/components/schemas/BasicIdentity"
        tls:
          $ref: "#/components/schemas/TlsIdentity"
      required: [access]

    AddIdentitiesRequest:
      type: object
      properties:
        identities:
          type: object
          description: Map of identity name → identity spec.
          additionalProperties:
            $ref: "#/components/schemas/IdentitySpec"
          example:
            ops:
              access: write
              local: {}
      required: [identities]

    RemoveIdentitiesRequest:
      type: object
      properties:
        identities:
          type: array
          items:
            type: string
          description: Names of identities to remove.
          example: ["ops"]
      required: [identities]

    RemovedIdentitiesResponse:
      type: object
      properties:
        result:
          type: array
          items:
            type: string
          description: Names of the identities that were actually removed.
          example: ["ops"]
      required: [result]
