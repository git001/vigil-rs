# Generated from vigild's ApiDoc (crates/vigild/src/api/openapi.rs); the
# running daemon serves the same spec at /openapi.json. Do not edit by hand:
#   UPDATE_OPENAPI=1 cargo test -p vigild openapi_yaml
openapi: 3.1.0
info:
  title: vigil API
  description: |-
    HTTP API for the vigild service supervisor daemon.

    Endpoints are available over two transports:
    - **Unix socket** (default `/run/vigil/vigild.sock`) — local access only
    - **HTTPS** (optional, enabled via `--tls-addr`) — network access with TLS

    **Unix socket example:**
    ```
    curl --unix-socket /run/vigil/vigild.sock http://localhost/v1/system-info
    ```

    **HTTPS example** (self-signed cert):
    ```
    curl --insecure https://localhost:8443/v1/system-info
    ```
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
  version: '4'
paths:
  /v1/alerts:
    get:
      tags:
      - alerts
      summary: List alert configurations
      description: |-
        Returns all configured alerts with their format, watched checks, and last observed check status per check.

        **Required access:** `read` or higher.
      operationId: list_alerts
      parameters:
      - name: names
        in: path
        description: Comma-separated list of names to filter by. Omit for all.
        required: true
        schema:
          type:
          - string
          - 'null'
      responses:
        '200':
          description: List of alert entries.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AlertInfo'
        '400':
          description: Unknown query parameter.
        '403':
          description: Forbidden.
        '500':
          description: Internal error.
  /v1/changes/{id}:
    get:
      tags:
      - changes
      summary: Get a change by ID
      description: '**Required access:** `read` or higher.'
      operationId: get_change
      parameters:
      - name: id
        in: path
        description: Change ID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The requested change record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeInfo'
        '403':
          description: Forbidden.
        '404':
          description: Change not found.
        '500':
          description: Internal error.
  /v1/checks:
    get:
      tags:
      - checks
      summary: List health checks
      description: |-
        Returns the current status of all or selected health checks.

        **Required access:** `open` (no credentials; usable by Kubernetes httpGet probes).
      operationId: list_checks
      parameters:
      - name: names
        in: path
        description: Comma-separated list of names to filter by. Omit for all.
        required: true
        schema:
          type:
          - string
          - 'null'
      responses:
        '200':
          description: List of check status entries.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CheckInfo'
        '400':
          description: Unknown query parameter.
        '500':
          description: Internal error.
  /v1/checks/refresh:
    post:
      tags:
      - checks
      summary: Run a check now
      description: |-
        Runs the check at once and returns its state after the run, plus `error`: why this run failed (absent when it passed).

        The run counts like a scheduled one: failures, threshold, status and alerts. A check with `startup: disabled` runs once without changing any state.

        **Required access:** `write` or higher.
      operationId: refresh_check
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckRefreshRequest'
        required: true
      responses:
        '200':
          description: The check after the run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckRefresh'
        '400':
          description: Invalid JSON.
        '403':
          description: Forbidden.
        '404':
          description: No check of that name.
        '415':
          description: Content-Type is not `application/json`.
        '422':
          description: Unknown field or wrong type in the body.
        '500':
          description: Internal error.
  /v1/health:
    get:
      tags:
      - checks
      summary: Health of the checks
      description: |-
        vigild's health endpoint, for Kubernetes `httpGet` probes: `200` with `{"healthy": true}` when none of the selected checks is down, otherwise `502` with `{"healthy": false}`.

        Only running checks count; a check with `startup: disabled` is ignored. `level=ready` includes `alive` checks. A name that is not a check is `404`, an unknown query parameter `400`.

        **Required access:** `open` (no credentials; usable by Kubernetes httpGet probes).
      operationId: health
      parameters:
      - name: level
        in: path
        description: |-
          `alive`: only checks with `level: alive`. `ready`: checks of both
          levels. Omit for all checks.
        required: true
        schema:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/CheckLevel'
      - name: names
        in: path
        description: Comma-separated check names. Omit for all checks.
        required: true
        schema:
          type:
          - string
          - 'null'
      responses:
        '200':
          description: No selected check is down.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthInfo'
        '400':
          description: Unknown query parameter or level.
        '404':
          description: A name is not a check.
        '502':
          description: At least one selected check is down.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthInfo'
  /v1/identities:
    get:
      tags:
      - identities
      summary: List identities
      description: '**Required access:** `admin`.'
      operationId: list_identities
      parameters:
      - name: names
        in: path
        description: Comma-separated list of names to filter by. Omit for all.
        required: true
        schema:
          type:
          - string
          - 'null'
      responses:
        '200':
          description: List of identities.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Identity'
        '400':
          description: Unknown query parameter.
        '403':
          description: Forbidden.
        '500':
          description: Internal error.
    post:
      tags:
      - identities
      summary: Add or update identities
      description: '**Required access:** `admin`.'
      operationId: add_identities
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddIdentitiesRequest'
        required: true
      responses:
        '200':
          description: Identities added or updated.
        '400':
          description: Invalid JSON.
        '403':
          description: Forbidden.
        '409':
          description: A name belongs to an identity from a layer file (read-only over the API).
        '415':
          description: Content-Type is not `application/json`.
        '422':
          description: Unknown field or wrong type in the body.
        '500':
          description: Internal error.
    delete:
      tags:
      - identities
      summary: Remove identities
      description: '**Required access:** `admin`.'
      operationId: remove_identities
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemoveIdentitiesRequest'
        required: true
      responses:
        '200':
          description: Names of the removed identities.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        '400':
          description: Invalid JSON.
        '403':
          description: Forbidden.
        '409':
          description: A name belongs to an identity from a layer file; nothing was removed.
        '415':
          description: Content-Type is not `application/json`.
        '422':
          description: Unknown field or wrong type in the body.
        '500':
          description: Internal error.
  /v1/logs:
    get:
      tags:
      - logs
      summary: Get recent log output
      description: |-
        Returns the most recent log lines from service stdout/stderr.

        With `follow=true` the response is a stream instead: the last `n` lines, then each new line, as newline-delimited JSON (`application/x-ndjson`), until the client closes the connection. An unknown query parameter is `400`.

        **Required access:** `read` or higher.
      operationId: get_logs
      parameters:
      - name: services
        in: path
        description: Comma-separated list of service names to filter by. Omit for all services.
        required: true
        schema:
          type:
          - string
          - 'null'
      - name: n
        in: path
        description: |-
          Number of most recent lines to return (default 100). With
          `follow=true` these come first, then the new lines.
        required: true
        schema:
          type:
          - integer
          - 'null'
          minimum: 0
      - name: follow
        in: path
        description: |-
          `true` keeps the connection open and streams newline-delimited JSON
          (`application/x-ndjson`), like `/v1/logs/follow?format=ndjson`.
        required: true
        schema:
          type:
          - boolean
          - 'null'
      responses:
        '200':
          description: Recent log entries; with `follow=true` an `application/x-ndjson` stream.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LogEntry'
        '400':
          description: Unknown query parameter or invalid value.
        '403':
          description: Forbidden.
        '500':
          description: Internal error.
  /v1/logs/follow:
    get:
      tags:
      - logs
      summary: Stream live log output
      description: |-
        Streams log entries in real time.

        **Formats** (`?format=`):
        - `json` *(default)* — SSE (`text/event-stream`), each event is `{"timestamp":"…","service":"…","stream":"…","message":"…"}`. Keep-alive comments (`: ping`) every 15 s.
        - `text` — SSE, each event is `[service] message`.
        - `ndjson` — `application/x-ndjson`, one JSON object per line, no SSE framing. Best for log collectors.

        An unknown query parameter or an invalid `format` is `400`.

        **Required access:** `read` or higher.
      operationId: follow_logs
      parameters:
      - name: services
        in: path
        description: Comma-separated list of service names to filter by. Omit for all services.
        required: true
        schema:
          type:
          - string
          - 'null'
      - name: format
        in: path
        description: 'Stream format: `json` (default), `text` or `ndjson`.'
        required: true
        schema:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/LogFormat'
      responses:
        '200':
          description: Log stream (content-type depends on `format`).
          content:
            text/event-stream: {}
        '400':
          description: Unknown query parameter or invalid value.
        '403':
          description: Forbidden.
  /v1/metrics:
    get:
      tags:
      - metrics
      summary: Render Prometheus/OpenMetrics metrics.
      description: '**Required access:** `metrics` or higher.'
      operationId: get_metrics
      responses:
        '200':
          description: OpenMetrics text exposition.
          content:
            application/openmetrics-text; version=1.0.0; charset=utf-8: {}
        '403':
          description: Forbidden.
  /v1/replan:
    post:
      tags:
      - replan
      summary: Reload layers and replan
      description: |-
        Reads all layer YAML files from the layers directory, re-merges them, starts newly enabled services, restarts running services whose configuration changed (and the services that require them), and stops removed ones. An invalid layer changes nothing.

        **Required access:** `write` or higher.
      operationId: replan
      responses:
        '200':
          description: Replan completed successfully.
        '403':
          description: Forbidden.
        '500':
          description: A layer file is invalid (the message says why), or an internal error.
  /v1/services:
    get:
      tags:
      - services
      summary: List services
      description: |-
        Returns the current status of all or selected services.

        **Required access:** `read` or higher.
      operationId: list_services
      parameters:
      - name: names
        in: path
        description: Comma-separated list of names to filter by. Omit for all.
        required: true
        schema:
          type:
          - string
          - 'null'
      responses:
        '200':
          description: List of service status entries.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServiceInfo'
        '400':
          description: Unknown query parameter.
        '403':
          description: Forbidden.
        '500':
          description: Internal error.
    post:
      tags:
      - services
      summary: Perform a service action
      description: |-
        Start, stop, restart, autostart, or replan one or more services.

        Pass an empty `services` array to act on all services; for `autostart`, all services with `startup: enabled` that are not scheduled. `replan` reloads the layers once, like `POST /v1/replan`, and ignores `services`.

        **Required access:** `write` or higher.
      operationId: services_action
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServicesAction'
        required: true
      responses:
        '200':
          description: Change record for the performed action.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeInfo'
        '400':
          description: Invalid JSON.
        '403':
          description: Forbidden.
        '415':
          description: Content-Type is not `application/json`.
        '422':
          description: Unknown field or wrong type in the body.
        '500':
          description: Internal error.
  /v1/signals:
    post:
      tags:
      - services
      summary: Send a signal to services
      description: |-
        Sends `signal` to the process group of each service in `services`, e.g. `SIGHUP` to make nginx reload its configuration. Every service must exist and have a running process (`starting`, `active` or `stopping`); otherwise none gets the signal. Signal names are written as in `stop-signal` (`SIGHUP`, `SIGUSR1`).

        **Required access:** `write` or higher.
      operationId: send_signals
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignalsRequest'
        required: true
      responses:
        '200':
          description: The services that got the signal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignalsResult'
        '400':
          description: Invalid JSON, unknown signal or empty `services`.
        '403':
          description: Forbidden.
        '404':
          description: A name is not a service.
        '409':
          description: A service has no running process.
        '415':
          description: Content-Type is not `application/json`.
        '422':
          description: Unknown field or wrong type in the body.
        '500':
          description: Internal error.
  /v1/system-info:
    get:
      tags:
      - system info
      summary: Get system info
      description: |-
        Returns the daemon version, boot ID, start time, and API addresses.

        **Required access:** `open` (no authentication needed).
      operationId: system_info
      responses:
        '200':
          description: Daemon system information.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemInfo'
        '500':
          description: Internal error.
  /v1/vigild:
    post:
      tags:
      - daemon
      summary: Control the daemon
      description: |-
        Stop or restart the vigild daemon gracefully.

        `stop` stops all services and exits. `restart` stops all services and re-executes the daemon in-place.

        **Required access:** `admin`.
      operationId: daemon_action
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DaemonActionRequest'
        required: true
      responses:
        '200':
          description: Action accepted.
        '400':
          description: Invalid JSON.
        '403':
          description: Forbidden.
        '415':
          description: Content-Type is not `application/json`.
        '422':
          description: Unknown field or wrong type in the body.
        '500':
          description: Internal error.
components:
  schemas:
    AddIdentitiesRequest:
      type: object
      description: Body for `POST /v1/identities` (add or update identities).
      required:
      - identities
      properties:
        identities:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/IdentitySpec'
          propertyNames:
            type: string
    AlertCheckStatus:
      type: object
      required:
      - check
      properties:
        check:
          type: string
        status:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/CheckStatus'
            description: Last known status (`null` = no event observed yet).
    AlertFormat:
      type: string
      enum:
      - webhook
      - alertmanager
      - cloud-events
      - otlp-logs
    AlertInfo:
      type: object
      required:
      - name
      - url
      - format
      - on-check
      - check-status
      properties:
        check-status:
          type: array
          items:
            $ref: '#/components/schemas/AlertCheckStatus'
          description: Last known status per watched check.
        format:
          $ref: '#/components/schemas/AlertFormat'
        name:
          type: string
        on-check:
          type: array
          items:
            type: string
          description: Check names that trigger this alert.
        on-service:
          type: array
          items:
            type: string
          description: Service names whose failures trigger this alert (`*` = all).
        on-vigild:
          type: array
          items:
            type: string
          description: vigild events that trigger this alert (`layers`, `*`).
        url:
          type: string
          description: Raw URL from config (may contain `"env:VAR"` placeholder).
    BasicIdentity:
      type: object
      description: |-
        Authenticates via HTTP Basic Auth.

        The password is verified against a SHA-512-crypt hash (format: `$6$salt$hash`).
        Generate a hash with: `openssl passwd -6`
      required:
      - password-hash
      properties:
        password-hash:
          type: string
          description: SHA-512-crypt password hash (`$6$...`).
    ChangeInfo:
      type: object
      required:
      - id
      - kind
      - summary
      - status
      - spawn-time
      properties:
        err:
          type:
          - string
          - 'null'
          description: Error message if status is `error`.
        id:
          type: string
          description: Monotonically increasing change ID.
        kind:
          type: string
        ready-time:
          type:
          - string
          - 'null'
          format: date-time
        spawn-time:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/ChangeStatus'
        summary:
          type: string
    ChangeStatus:
      type: string
      enum:
      - doing
      - done
      - error
      - hold
    CheckInfo:
      type: object
      required:
      - name
      - level
      - status
      - failures
      - threshold
      properties:
        failures:
          type: integer
          format: int32
          description: Consecutive failures since last success.
          minimum: 0
        last-error:
          type:
          - string
          - 'null'
          description: |-
            Why the last run failed, e.g. `HTTP 503 Service Unavailable` or
            `exit status 1: <output>`. Absent once a run passes.
        level:
          $ref: '#/components/schemas/CheckLevel'
        name:
          type: string
        next-run-in-secs:
          type:
          - integer
          - 'null'
          format: int64
          description: Seconds until the next scheduled check run. `null` during initial delay.
          minimum: 0
        status:
          $ref: '#/components/schemas/CheckStatus'
        threshold:
          type: integer
          format: int32
          description: Failures required to declare the check down.
          minimum: 0
    CheckLevel:
      type: string
      enum:
      - alive
      - ready
    CheckRefresh:
      type: object
      description: |-
        Result of `POST /v1/checks/refresh`: the check after the run, and why
        the run failed.
      required:
      - info
      properties:
        error:
          type:
          - string
          - 'null'
          description: Why this run failed; absent when it passed.
        info:
          $ref: '#/components/schemas/CheckInfo'
    CheckRefreshRequest:
      type: object
      description: Body of `POST /v1/checks/refresh`.
      required:
      - name
      properties:
        name:
          type: string
          description: The check to run now.
      additionalProperties: false
    CheckStatus:
      type: string
      enum:
      - up
      - down
      - inactive
    DaemonAction:
      type: string
      enum:
      - stop
      - restart
    DaemonActionRequest:
      type: object
      required:
      - action
      properties:
        action:
          $ref: '#/components/schemas/DaemonAction'
    ExitInfo:
      type: object
      description: How a service process ended.
      properties:
        code:
          type:
          - integer
          - 'null'
          format: int32
          description: Exit code, if the process exited normally.
        signal:
          type:
          - integer
          - 'null'
          format: int32
          description: Signal number, if the process was killed by a signal.
    HealthInfo:
      type: object
      description: Result of `GET /v1/health`.
      required:
      - healthy
      properties:
        healthy:
          type: boolean
          description: No selected, running check is down.
    Identity:
      type: object
      description: A named principal with a declared access level and optional auth info.
      required:
      - name
      - access
      properties:
        access:
          $ref: '#/components/schemas/IdentityAccess'
        basic:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/BasicIdentity'
        layer:
          type:
          - string
          - 'null'
          description: The layer file (without extension) that defines it, for `layer`.
        local:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/LocalIdentity'
        name:
          type: string
        source:
          $ref: '#/components/schemas/IdentitySource'
          description: '`api` or `layer` (missing in answers of older vigild: `api`).'
        tls:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/TlsIdentity'
    IdentityAccess:
      type: string
      description: |-
        Access levels ordered from least to most privileged.

        | Level     | Description |
        |-----------|-------------|
        | `open`    | No authentication required — health and system-info endpoints. |
        | `metrics` | Access to `GET /v1/metrics` only. |
        | `read`    | Most `GET` endpoints. |
        | `write`   | Read + service/check control (start, stop, restart, trigger). |
        | `admin`   | Full access including identity management. |
      enum:
      - open
      - metrics
      - read
      - write
      - admin
    IdentitySource:
      type: string
      description: Where an identity comes from.
      enum:
      - api
      - layer
    IdentitySpec:
      type: object
      description: Spec used when adding/updating an identity (no `name` field — that's the key).
      required:
      - access
      properties:
        access:
          $ref: '#/components/schemas/IdentityAccess'
        basic:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/BasicIdentity'
        local:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/LocalIdentity'
        tls:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/TlsIdentity'
    LocalIdentity:
      type: object
      description: Matches a connection coming in over the Unix socket by the caller's UID.
      properties:
        user-id:
          type:
          - integer
          - 'null'
          format: int32
          description: Restrict to this UID. Omit to allow any local user.
          minimum: 0
      additionalProperties: false
    LogEntry:
      type: object
      required:
      - timestamp
      - service
      - stream
      - message
      properties:
        message:
          type: string
        service:
          type: string
        stream:
          $ref: '#/components/schemas/LogStream'
        timestamp:
          type: string
          format: date-time
    LogStream:
      type: string
      enum:
      - stdout
      - stderr
    RemoveIdentitiesRequest:
      type: object
      description: Body for `DELETE /v1/identities`.
      required:
      - identities
      properties:
        identities:
          type: array
          items:
            type: string
    ServiceAction:
      type: string
      enum:
      - start
      - stop
      - restart
      - autostart
      - replan
    ServiceInfo:
      type: object
      required:
      - name
      - startup
      - current
      - stop-signal
      - on-success
      - on-failure
      properties:
        current:
          $ref: '#/components/schemas/ServiceStatus'
        current-since:
          type:
          - string
          - 'null'
          format: date-time
        last-exit:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/ExitInfo'
            description: |-
              How the last process of this service ended (raw, before
              `exit-code-map`). Absent until the service has exited once.
        name:
          type: string
        next-run:
          type:
          - string
          - 'null'
          format: date-time
          description: Next scheduled run (`schedule`); absent for unscheduled services.
        on-failure:
          type: string
          description: 'Effective on-failure policy (default: restart).'
        on-success:
          type: string
          description: 'Effective on-success policy (default: restart).'
        startup:
          $ref: '#/components/schemas/Startup'
        status-message:
          type:
          - string
          - 'null'
          description: 'Last `STATUS=` text the service sent via sd_notify (`ready: notify`).'
        stop-signal:
          type: string
          description: 'Effective stop signal (default: SIGTERM).'
        waiting-for:
          type: array
          items:
            type: string
          description: |-
            Dependencies (`after`, `before`, `requires`) a service queued by
            autostart still waits for before it starts; absent otherwise.
    ServiceStatus:
      type: string
      enum:
      - starting
      - active
      - inactive
      - backoff
      - error
      - done
    ServicesAction:
      type: object
      required:
      - action
      - services
      properties:
        action:
          $ref: '#/components/schemas/ServiceAction'
        services:
          type: array
          items:
            type: string
    SignalsRequest:
      type: object
      description: Body of `POST /v1/signals`.
      required:
      - signal
      - services
      properties:
        services:
          type: array
          items:
            type: string
          description: The services to send it to; each must be running.
        signal:
          type: string
          description: Signal name as in `stop-signal`, e.g. `SIGHUP`, `SIGUSR1`.
      additionalProperties: false
    SignalsResult:
      type: object
      description: Result of `POST /v1/signals`.
      required:
      - signal
      - services
      properties:
        services:
          type: array
          items:
            type: string
          description: The services that got the signal.
        signal:
          type: string
    Startup:
      type: string
      enum:
      - disabled
      - enabled
    SystemInfo:
      type: object
      required:
      - boot-id
      - http-address
      - version
      - start-time
      properties:
        boot-id:
          type: string
          format: uuid
          description: UUID generated fresh at each daemon start.
        http-address:
          type: string
          description: Address of the HTTP API (Unix socket path).
        https-address:
          type:
          - string
          - 'null'
          description: Address of the HTTPS API, if TLS is enabled.
        start-time:
          type: string
          format: date-time
          description: Timestamp when the daemon started.
        version:
          type: string
          description: vigild version string.
    TlsIdentity:
      type: object
      description: Matches a TLS connection whose client cert was signed by the given CA.
      required:
      - ca-cert
      properties:
        ca-cert:
          type: string
          description: PEM-encoded CA certificate used to verify the client cert.
tags:
- name: system info
- name: services
- name: changes
- name: checks
- name: alerts
- name: logs
- name: replan
- name: identities
- name: metrics
- name: daemon
