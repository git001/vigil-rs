# squid for tests/proxy/squid.sh, on the host network. Requests from this
# host only, to any port (a default squid.conf allows CONNECT to 443 only).
# No cache; the access log goes to stdout (podman logs), one line per
# request.
#
# Two ports:
#   @TUNNEL_PORT@  a plain proxy: CONNECT opens a tunnel, the TLS session
#                  runs between client and vigild (mTLS works).
#   @BUMP_PORT@    a man in the middle, like a corporate proxy: squid ends
#                  the client's TLS with a certificate it makes for the
#                  host, signed by its own CA (mitm-ca.crt), and opens its
#                  own TLS session to vigild, verified with vigild's CA.
#                  A client certificate does not get through.
#
# squid.sh replaces the ports; /etc/squid/test is its work directory.
http_port 127.0.0.1:@TUNNEL_PORT@
http_port 127.0.0.1:@BUMP_PORT@ ssl-bump tls-cert=/etc/squid/test/mitm-ca.crt tls-key=/etc/squid/test/mitm-ca.key generate-host-certificates=on

# Look at the client's and then vigild's hello before bumping, so the
# certificate squid makes copies vigild's names (IP:127.0.0.1).
acl step1 at_step SslBump1
acl step2 at_step SslBump2
ssl_bump peek step1
ssl_bump stare step2
ssl_bump bump all
tls_outgoing_options cafile=/etc/squid/test/ca.crt
# Makes the host certificates; its database is created in the image.
sslcrtd_program /usr/lib/squid/security_file_certgen -s /var/cache/squid/ssl_db -M 4MB
sslcrtd_children 2

http_access allow localhost
http_access deny all
cache deny all
access_log stdio:/dev/stdout
cache_log stdio:/dev/stderr
logfile_rotate 0
pid_filename none
shutdown_lifetime 0 seconds
