# web reloads on SIGHUP: it prints "reloaded" (vigild keeps it in its log
# store, GET /v1/logs), like nginx re-reading its configuration. It sets the
# trap first and only then creates $READY_FILE; the check web-started makes
# web ready once that file exists, so a SIGHUP after "service is ready"
# always meets the trap. idle is not started.
services:
  web:
    command: sh -c 'trap "echo reloaded" HUP; touch "$READY_FILE"; echo started; while :; do sleep 0.1; done'
    startup: enabled
    pass-env-glob: [READY_FILE]
    ready: check
    ready-check: web-started
  idle:
    command: sleep 300

checks:
  web-started:
    level: alive
    startup: enabled
    delay: 0s
    period: 1s
    exec:
      command: 'test -e "$READY_FILE"'
      pass-env-glob: [READY_FILE]
