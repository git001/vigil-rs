# vtest v0034: load. 20 services that write a line every 50 ms and ignore
# SIGHUP (so the signal storm of the test does not kill them), 20 exec
# checks every second, and churn: chk-flap fails in every other second, so
# it goes down again and again and vigild restarts svc-churn each time
# (on-check-failure).
services:
  svc01:
    command: "/bin/sh -c 'trap \"\" HUP; i=0; while true; do echo svc01-line-$i; i=$((i+1)); sleep 0.05; done'"
    startup: enabled
