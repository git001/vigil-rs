# The same as ../before with two changes: db gets another environment (its
# process changes, so the replan restarts db and api, which requires it),
# and web only another summary (no restart).
services:
  db:
    command: sh -c 'echo "db started with max_connections=$MAX_CONNECTIONS"; exec sleep 300'
    startup: enabled
    environment:
      MAX_CONNECTIONS: "200"
  api:
    command: sh -c 'echo "api started"; exec sleep 300'
    startup: enabled
    requires: [db]
  web:
    summary: public web site
    command: sh -c 'echo "web started"; exec sleep 300'
    startup: enabled
