# A check that always fails (nothing listens on port 1) and an alert to the
# test's webhook server; vigild gets WEBHOOK_URL from the test.
checks:
  dummy-check:
    override: merge
    startup: enabled
    period: 1s
    timeout: 1s
    delay: 0s
    http:
      url: "http://127.0.0.1:1/probe"

alerts:
  test-alert:
    override: merge
    url: "env:WEBHOOK_URL"
    on-check: [dummy-check]
