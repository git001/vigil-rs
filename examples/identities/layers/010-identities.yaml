summary: Identity example — one user per access level

# Four users with HTTP Basic auth, one per access level. The hashes are
# SHA-512 crypt hashes from `openssl passwd -6`; the passwords are only
# here so the example can be tried:
#
#   Username      Password      Access level
#   -----------   -----------   --------------------------------------
#   metrics-bot   m3tr1cs!      metrics  (GET /v1/metrics only)
#   reader        r3ad0nly!     read     (all GET endpoints)
#   writer        wr1t3acc!     write    (read and service control)
#   admin         adm1npass!    admin    (full access incl. identities)
#
# Identities from layer files are read-only over the API and do not end
# the bootstrap: root and vigild's own UID stay admin on the Unix socket,
# so `podman exec … vigil services list` keeps working without a password.
# To see the access levels at work, call the TLS listener instead (see the
# Containerfile).
#
# In production, keep the hashes out of the image: mount them as files
# (for example from a Kubernetes Secret) and use password-hash-file
# instead of password-hash.

identities:

  metrics-bot:
    access: metrics
    basic:
      password-hash: "$6$ClWHyEv/IsYFlD4i$UOBjsXEjuWf4E0PApPYuCoxrebWQ.Bje5VD0ZbherBHdPrAxvF.cwrOldbYeVPIgWjkq2SXYe5ctLpWoejN161"

  reader:
    access: read
    basic:
      password-hash: "$6$I48dMASmHlzgoGV4$WFZg7mRWeoa6hzVWef229Oi1L5oJWoQ60KD6JlUiTltYebi1rTdRvOg6bQiwGeU0KhJeTuKMJIfBNPQG6UUka/"

  writer:
    access: write
    basic:
      password-hash: "$6$aCatiE/x2x33jJN5$.AYXChTOe1dgzuTMWwGphzybhOYyO4.i7YIIleIwOakS67FOin70ObtNBNGxk7dFi1Q6EvmkGF0ITfLwiMjv9/"

  admin:
    access: admin
    basic:
      password-hash: "$6$2h2aVHht59EY5KPS$akdKSpyt/qwHn3.uy56gWImz2z.PT8fSmLhFEGS4nvNhhnv2Q.9GDz4ccBYOfl159H3uSsSgLpP73jsfo/lhW1"
