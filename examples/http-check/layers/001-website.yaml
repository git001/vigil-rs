summary: website health check

checks:

  website-alive:
    # An external site, not this container: level ready, so that a liveness
    # probe on GET /v1/health?level=alive does not restart the container
    # while the site is down.
    level: ready
    startup: enabled
    # delay: 5s      # suppress first N seconds (default: 3s)
    period: 1m
    timeout: 3s
    threshold: 3
    http:
      url: https://example.com/
      # Custom request headers (e.g. auth tokens, tenant IDs):
      # headers:
      #   Authorization: "Bearer mytoken"
      #   X-Tenant-ID: "prod"
      #
      # TLS: the CAs to trust in addition to the system CAs, and a client
      # certificate for servers that require one. insecure: true instead
      # skips the certificate check (only for self-signed test servers).
      # tls:
      #   ca: /etc/vigil/internal-ca.pem
      #   cert: /run/secrets/vigil/client.crt
      #   key: /run/secrets/vigil/client.key
      #
      # Without proxy: the check connects directly; HTTPS_PROXY and similar
      # variables in vigild's environment are not used.
      # proxy:
      #   url: http://proxy.example.com:3128
      #   no-proxy: "localhost, .svc.cluster.local, 10.0.0.0/8"

alerts:

  website-down:
    url: http://localhost:8000
    format: alertmanager #webhook
    on-check: [website-alive]
