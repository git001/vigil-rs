summary: website health check with multi-format alerting

# To use (every env:VAR below must be set, or vigild refuses the layer):
#   export WEBHOOK_AUTH="Bearer MY-tok3n"
#   export CLUSTER_NAME=prod-eu-1
#   export KUBERNETES_NAMESPACE=shop
#   export KUBERNETES_SERVICE_NAME=api
#   export ALERTMANAGER_URL=http://alertmanager:9093/api/v2/alerts
#   export ALERTMANAGER_AUTH="Bearer MY-tok3n"
#   export HTTPS_PROXY=http://corp-proxy.example.com:3128
#   export NO_PROXY=localhost,.internal
#   vigild --layers-dir examples/alerts/layers --path-prefix /tmp/vigil-demo

# ---------------------------------------------------------------------------
# Checks
# ---------------------------------------------------------------------------
checks:

  website-alive:
    level: alive
    startup: enabled
    delay: 5s
    period: 1m
    timeout: 5s
    threshold: 3
    http:
      url: https://example.com/

# ---------------------------------------------------------------------------
# Alerts
#
# All alert formats support:
#
#   labels / send-info-fields:
#     Static values  →  key: "value"
#     Env-resolved   →  key: "env:ENV_VAR_NAME"
#
#   An alert sees only the vigild environment variables its pass-env-glob /
#   pass-env-regex allows (like services); an env:VAR that is not allowed
#   or not set makes the layer invalid.
#
# Alerts fire on state transitions only (Up→Down = firing, Down→Up = resolved).
# ---------------------------------------------------------------------------
alerts:

  # ---- Generic JSON webhook (default format) --------------------------------
  # POST body:
  #   { "check": "website-alive", "status": "down",
  #     "timestamp": "2026-…", "labels": {…}, "info": {…} }
  #
  webhook-example:
    url: http://my-webhook-endpoint:8080/alert
    pass-env-glob: [WEBHOOK_AUTH, CLUSTER_NAME, KUBERNETES_NAMESPACE, KUBERNETES_SERVICE_NAME]
    format: webhook
    on-check: [website-alive]
    headers:
      Authorization: "env:WEBHOOK_AUTH"           # holds "Bearer <token>"
    labels:
      env: production
      cluster: "env:CLUSTER_NAME"
    send-info-fields:
      k8s_namespace: "env:KUBERNETES_NAMESPACE"
      k8s_service:   "env:KUBERNETES_SERVICE_NAME"

  # ---- Prometheus Alertmanager ---------------------------------------------
  # Compatible with POST /api/v2/alerts.
  # Sends a "firing" alert on Down; sends a "resolved" alert (endsAt=now) on Up.
  # "alertname" and "check" labels are added automatically.
  #
  alertmanager-example:
    url: http://alertmanager:9093/api/v2/alerts
    pass-env-glob: [CLUSTER_NAME]
    format: alertmanager
    on-check: [website-alive]
    labels:
      severity:  critical
      env:       production
      cluster:   "env:CLUSTER_NAME"
    send-info-fields:
      description: "website-alive check failed"
      runbook:     "https://wiki.example.com/runbooks/website-down"

  # ---- CNCF CloudEvents 1.0 -----------------------------------------------
  # Content-Type: application/cloudevents+json
  # type: "io.vigil.check.failed" / "io.vigil.check.recovered"
  #
  cloudevents-example:
    url: http://knative-broker/default/broker
    pass-env-glob: [KUBERNETES_SERVICE_NAME]
    format: cloud-events
    on-check: [website-alive]
    labels:
      env: production
    send-info-fields:
      service: "env:KUBERNETES_SERVICE_NAME"

  # ---- OpenTelemetry OTLP HTTP/JSON logs -----------------------------------
  # Compatible with POST /v1/logs (OTLP HTTP JSON).
  # severityNumber: 17 (ERROR) on Down, 9 (INFO) on Up.
  # Labels and send-info-fields are added as LogRecord attributes.
  #
  otlp-example:
    url: http://otel-collector:4318/v1/logs
    pass-env-glob: [KUBERNETES_NAMESPACE]
    format: otlp-logs
    on-check: [website-alive]
    labels:
      service.name:      vigild
      service.namespace: "env:KUBERNETES_NAMESPACE"
      deployment.environment: production
    send-info-fields:
      check.description: "website reachability"

  # ---- Custom CA / self-signed TLS endpoint --------------------------------
  alertmanager-custom-tls:
    url: https://alertmanager-internal:9093/api/v2/alerts
    pass-env-glob: [CLUSTER_NAME]
    format: alertmanager
    on-check: [website-alive]
    # An unreadable tls.ca makes the layer invalid: uncomment these lines
    # once the CA file exists. Alternatively, insecure: true skips the
    # certificate check entirely.
    # tls:
    #   ca: /etc/vigil/certs/internal-ca.pem
    labels:
      cluster: "env:CLUSTER_NAME"

  # ---- Via HTTP proxy -------------------------------------------------------
  # Without a proxy: block, the alert uses HTTPS_PROXY, ALL_PROXY or
  # HTTP_PROXY and NO_PROXY from vigild's environment when its pass-env-glob
  # allows them (same precedence as the vigil CLI). A proxy: block wins, and
  # then only its own no-proxy list applies.
  # A proxy with a certificate from its own CA needs that CA in tls.ca: the
  # HTTP client has no separate TLS settings for the proxy.
  alertmanager-via-proxy:
    url: http://alertmanager.internal:9093/api/v2/alerts
    pass-env-glob: [CLUSTER_NAME]
    format: alertmanager
    on-check: [website-alive]
    proxy:
      url: "http://corp-proxy.example.com:3128"
      no-proxy: "localhost, .internal, 10.0.0.0/8"
    # tls:
    #   ca: /etc/vigil/certs/proxy-ca.pem
    labels:
      cluster: "env:CLUSTER_NAME"

  # ---- All new parameters combined -----------------------------------------
  # url        from the environment; an unset variable makes the layer invalid
  # retry-attempts / retry-backoff — override the defaults (3 / ["1s", "2s"])
  # proxy      url and no-proxy from env:VAR here; without a proxy: block,
  #            from HTTPS_PROXY etc. when pass-env-glob allows them
  full-example:
    url: "env:ALERTMANAGER_URL"           # e.g. http://alertmanager:9093/api/v2/alerts
    pass-env-glob: [ALERTMANAGER_*, CLUSTER_NAME, KUBERNETES_NAMESPACE, HTTPS_PROXY, NO_PROXY]
    format: alertmanager
    on-check: [website-alive]
    headers:
      Authorization: "env:ALERTMANAGER_AUTH"      # holds "Bearer <token>"
    labels:
      severity: critical
      cluster:  "env:CLUSTER_NAME"
    send-info-fields:
      k8s_namespace: "env:KUBERNETES_NAMESPACE"
      runbook: "https://wiki.example.com/runbooks/website-down"
    retry-attempts: 5
    retry-backoff: ["1s", "2s", "5s", "10s"]
    proxy:
      url: "env:HTTPS_PROXY"
      no-proxy: "env:NO_PROXY"
    # tls:
    #   ca: /etc/vigil/certs/internal-ca.pem
