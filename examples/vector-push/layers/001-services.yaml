summary: Vector push-mode log collection example

services:

  dummy-logger:
    summary: Generates simulated application log output (stdout + stderr)
    command: >-
      sh -c 'i=0; while true; do
      echo "INFO  req=$i GET /api/users status=200 duration_ms=$((i % 47 + 3))";
      echo "DEBUG req=$i cache_key=user_$((i % 5)) hit=$((i % 3 == 0))";
      if [ $((i % 7)) -eq 0 ]; then echo "ERROR req=$i downstream=payments timeout=30s" >&2; fi;
      i=$((i+1)); sleep 1; done'
    startup: enabled
    on-failure: restart
    # vigild connects to Vector's Unix socket and pushes one JSON object per
    # line. It reconnects by itself until Vector listens, so no after: is
    # needed. logs-forward: disabled keeps the lines off vigild's stdout;
    # Vector prints them.
    logs-forward: disabled
    logs-push-socket: /tmp/vector-input.sock

  vector:
    summary: Vector — listens on a Unix socket; vigild pushes ndjson directly
    command: vector --config /etc/vector/vigil-vector.toml
    startup: enabled
    # Vector's own messages go to stderr; warn keeps the startup banner out of
    # the container log.
    environment:
      VECTOR_LOG: warn
    on-failure: restart
    backoff-delay: 2s
    backoff-factor: 2.0
    backoff-limit: 30s
    # Vector writes the collected logs directly to container stdout.
    logs-forward: passthrough
